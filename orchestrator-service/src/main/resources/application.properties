spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.properties.value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic.name1=order_topics
spring.kafka.topic.name2=update_topics

# Producer properties
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# 2. LA LIGNE MAGIQUE : On lui interdit d'ajouter l'étiquette __TypeId__
# Le message devient 100% agnostique (juste du texte JSON pur, lisible par n'importe quel langage)
spring.kafka.producer.properties.spring.json.add.type.headers=false

