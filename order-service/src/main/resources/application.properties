server.port=8083
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.name1=order_topics
spring.kafka.topic.name2=update_topics
spring.kafka.consumer.group-id=order-group

# Consumer configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092


# Crucial: Allow Kafka to trust your DTO package for deserialization

# Use the ErrorHandlingDeserializer to catch and handle poison pills
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=eventdriven.kafka.basedomains.dto.OrderEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=eventdriven.kafka.basedomains.dto